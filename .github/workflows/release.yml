name: Release EVE-IW-Preview

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build GitHub release
    runs-on: windows-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm tag belongs to release branch
        shell: pwsh
        run: |
          git fetch origin release
          git merge-base --is-ancestor "${{ github.sha }}" "origin/release"
          if ($LASTEXITCODE -ne 0) {
            throw "Tag ${{ github.ref_name }} is not part of the release branch."
          }

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate tag and project version
        id: version
        shell: pwsh
        run: |
          $projectPath = ".\src\AUTZ.IronWorks.Preview\AUTZ.IronWorks.Preview.csproj"
          [xml]$project = Get-Content $projectPath
          $projectVersion = $project.Project.PropertyGroup.Version | Select-Object -First 1
          $tagName = "${{ github.ref_name }}"
          $tagVersion = $tagName.TrimStart("v")
          if ($projectVersion -ne $tagVersion) {
            throw "Project version '$projectVersion' does not match tag '$tagVersion'."
          }
          $isPrerelease = $tagVersion -match "-"
          "version=$tagVersion" >> $env:GITHUB_OUTPUT
          "prerelease=$($isPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Confirm required project files
        shell: pwsh
        run: |
          $requiredFiles = @(
            ".\AUTZ.IronWorks.Preview.sln",
            ".\README.md",
            ".\src\AUTZ.IronWorks.Preview\AUTZ.IronWorks.Preview.csproj",
            ".\src\AUTZ.IronWorks.Preview\Core\MemoryTrim.cs",
            ".\src\AUTZ.IronWorks.Preview\Services\PreviewManager.cs",
            ".\src\AUTZ.IronWorks.Preview\Services\LogMonitorService.cs"
          )
          $missingFiles = @($requiredFiles | Where-Object { -not (Test-Path $_) })
          if ($missingFiles.Count -gt 0) {
            $missingFiles | ForEach-Object { Write-Host "Missing: $_" -ForegroundColor Red }
            throw "Release source is incomplete."
          }

      - name: Restore
        shell: pwsh
        run: dotnet restore ".\AUTZ.IronWorks.Preview.sln"

      - name: Build
        shell: pwsh
        run: dotnet build ".\AUTZ.IronWorks.Preview.sln" --configuration Release --no-restore --nologo

      - name: Publish Windows executable
        shell: pwsh
        run: |
          dotnet publish ".\src\AUTZ.IronWorks.Preview\AUTZ.IronWorks.Preview.csproj" `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            --output ".\published" `
            --nologo

      - name: Validate executable
        shell: pwsh
        run: |
          $exe = ".\published\EVE-IW-Preview.exe"
          $expectedVersion = "${{ steps.version.outputs.version }}"
          if (-not (Test-Path $exe)) { throw "EVE-IW-Preview.exe was not created." }
          $actualVersion = (Get-Item $exe).VersionInfo.ProductVersion
          if (-not $actualVersion.StartsWith($expectedVersion)) {
            throw "Executable version '$actualVersion' does not match '$expectedVersion'."
          }

      - name: Create release package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $packageFolder = ".\EVE-IW-Preview-v$version"
          $asset = ".\EVE-IW-Preview-Windows-x64.zip"
          New-Item -ItemType Directory -Path $packageFolder -Force | Out-Null
          Copy-Item ".\published\EVE-IW-Preview.exe" "$packageFolder\EVE-IW-Preview.exe"
          Copy-Item ".\README.md" "$packageFolder\README.md"
          @"
          EVE-IW-Preview v$version

          1. Extract the ZIP into a permanent folder.
          2. Run EVE-IW-Preview.exe.
          3. Do not run the application from inside the ZIP.

          Requires Windows x64 and the .NET 8 Desktop Runtime.
          "@ | Set-Content "$packageFolder\INSTALL.txt" -Encoding UTF8
          Compress-Archive -Path $packageFolder -DestinationPath $asset -Force
          if (-not (Test-Path $asset)) { throw "Release ZIP was not created." }

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $hash = Get-FileHash ".\EVE-IW-Preview-Windows-x64.zip" -Algorithm SHA256
          "$($hash.Hash)  EVE-IW-Preview-Windows-x64.zip" | Set-Content ".\SHA256SUMS.txt" -Encoding ASCII

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: EVE-IW-Preview ${{ github.ref_name }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            EVE-IW-Preview-Windows-x64.zip
            SHA256SUMS.txt
